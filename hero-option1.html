<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Option 1 — Sukwana Mweemba &amp; Partners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Playfair+Display:ital,wght@0,400;0,900;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --colour-primary:      #854d4f;
      --colour-primary-dark: #824e4e;
      --colour-accent:       #b8d0db;
      --colour-bg:           #f7f9f9;
      --colour-border:       #c6c5c2;
      --colour-text:         #2a2a2a;
      --colour-white:        #ffffff;
      --font-display:        'Playfair Display', Georgia, serif;
      --font-body:           'Inter', sans-serif;
      --ease-weighted:       cubic-bezier(0.23, 1, 0.32, 1);
    }

    body {
      font-family: var(--font-body);
      background: var(--colour-bg);
      color: var(--colour-text);
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 0; width: 100%;
      padding: 1.5rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: rgba(247, 249, 249, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--colour-border);
    }

    .logo {
      font-family: var(--font-body);
      font-size: 0.9rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--colour-primary);
      text-decoration: none;
    }

    .location-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--colour-primary-dark);
      opacity: 0.8;
      text-decoration: none;
      font-weight: 300;
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 10%;
      background: var(--colour-bg);
      position: relative;
      overflow: hidden;
    }

    /* Canvas sits behind everything */
    #line-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-eyebrow {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--colour-accent);
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s var(--ease-weighted) 0.3s forwards;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 900;
      line-height: 0.95;
      color: var(--colour-primary);
      opacity: 0;
      transform: translateY(50px);
      animation: fadeUp 1.2s var(--ease-weighted) 0.5s forwards;
    }

    .hero-title span {
      display: block;
      font-style: italic;
      font-weight: 400;
      color: var(--colour-accent);
      text-shadow: 1px 1px 0 var(--colour-border);
      margin-top: 0.15em;
    }

    .hero-divider {
      width: 60px;
      height: 1px;
      background: var(--colour-primary);
      margin: 2rem auto;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-weighted) 1s forwards;
    }

    .hero-tagline {
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--colour-text);
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-weighted) 1.1s forwards;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--colour-primary-dark);
      text-decoration: none;
      font-weight: 700;
      animation: pulse 2s ease-in-out infinite;
      z-index: 2;
    }

    /* Corner year stamp */
    .year-stamp {
      position: absolute;
      bottom: 2.5rem;
      right: 5%;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      color: var(--colour-primary);
      opacity: 0.25;
      z-index: 2;
    }

    .est-stamp {
      position: absolute;
      bottom: 2.5rem;
      left: 5%;
      font-family: var(--font-body);
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--colour-text);
      opacity: 0.35;
      text-transform: uppercase;
      z-index: 2;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-eyebrow, .hero-title, .hero-divider, .hero-tagline {
        animation: none; opacity: 1; transform: none;
      }
      #line-canvas { display: none; }
    }

    /* ── PREVIEW LABEL ── */
    .preview-badge {
      position: fixed;
      top: 80px;
      right: 1.5rem;
      background: var(--colour-primary);
      color: var(--colour-white);
      font-family: var(--font-body);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      z-index: 2000;
    }
  </style>
</head>
<body>

  <div class="preview-badge">Option 1 of 3</div>

  <nav>
    <a href="#" class="logo">S.M &amp; Partners</a>
    <span class="location-label">Rhodes Park, Lusaka</span>
  </nav>

  <section class="hero">
    <canvas id="line-canvas" aria-hidden="true"></canvas>

    <div class="hero-content">
      <p class="hero-eyebrow">Advocates &amp; Commissioners for Oaths</p>
      <h1 class="hero-title">
        Sukwana Mweemba<br />&amp; Partners
        <span>Proven Legacy.</span>
      </h1>
      <div class="hero-divider"></div>
      <p class="hero-tagline">Established 1992 &nbsp;·&nbsp; Rhodes Park, Lusaka &nbsp;·&nbsp; 2-Day Standard Turnaround</p>
    </div>

    <a href="#" class="scroll-indicator">Explore the Firm</a>
    <span class="year-stamp">Est. 1992</span>
    <span class="est-stamp">Lusaka, Zambia</span>
  </section>

  <script>
    const canvas = document.getElementById('line-canvas');
    const ctx = canvas.getContext('2d');

    const PRIMARY   = '#854d4f';
    const ACCENT    = '#b8d0db';
    const BORDER    = '#c6c5c2';

    let W, H, lines, animFrame;

    function resize() {
      W = canvas.width  = canvas.offsetWidth;
      H = canvas.height = canvas.offsetHeight;
      buildLines();
    }

    function buildLines() {
      lines = [];

      const configs = [
        // Diagonals top-left to bottom-right
        { x1p: -0.1, y1p: 0,     x2p: 0.5,  y2p: 1,    color: BORDER,  op: 0.3,  speed: 0.00008 },
        { x1p: 0.1,  y1p: 0,     x2p: 0.7,  y2p: 1,    color: BORDER,  op: 0.3,  speed: 0.00005 },
        { x1p: 0.35, y1p: 0,     x2p: 1.1,  y2p: 1,    color: BORDER,  op: 0.3,  speed: 0.00007 },
        { x1p: 0.6,  y1p: 0,     x2p: 1.2,  y2p: 1,    color: BORDER,  op: 0.3,  speed: 0.00004 },
        // Diagonals top-right to bottom-left
        { x1p: 1.1,  y1p: 0,     x2p: 0.4,  y2p: 1,    color: ACCENT,  op: 0.2,  speed: 0.00006 },
        { x1p: 0.85, y1p: 0,     x2p: 0.1,  y2p: 1,    color: ACCENT,  op: 0.2,  speed: 0.00009 },
        // Shallow diagonals
        { x1p: -0.2, y1p: 0.3,   x2p: 1.2,  y2p: 0.55, color: BORDER,  op: 0.3,  speed: 0.00003 },
        { x1p: -0.2, y1p: 0.55,  x2p: 1.2,  y2p: 0.75, color: BORDER,  op: 0.3,  speed: 0.00004 },
        // Primary line
        { x1p: -0.05, y1p: 0.15, x2p: 0.45, y2p: 1,    color: PRIMARY, op: 0.15, speed: 0.00005 },
      ];

      configs.forEach((c, i) => {
        lines.push({ ...c, offset: Math.random() * Math.PI * 2, phase: i * 0.3 });
      });
    }

    let firstFrame = true;
    function draw(t) {
      ctx.clearRect(0, 0, W, H);

      lines.forEach(l => {
        const drift = Math.sin(t * l.speed + l.offset) * 12;
        const x1 = l.x1p * W + drift;
        const y1 = l.y1p * H;
        const x2 = l.x2p * W + drift;
        const y2 = l.y2p * H;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = l.color;
        ctx.globalAlpha  = l.op;
        ctx.lineWidth    = l.color === BORDER ? 1.5 : 1;
        ctx.stroke();
      });

      ctx.globalAlpha = 1;

      if (firstFrame) {
        console.log('line-canvas dimensions:', W, 'x', H);
        firstFrame = false;
      }

      animFrame = requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    setTimeout(() => {
      resize();
      animFrame = requestAnimationFrame(draw);
    }, 100);
  </script>

</body>
</html>
